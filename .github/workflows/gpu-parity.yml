name: GPU parity

on:
  pull_request:
  push:
    branches: [main, fix/gpu-parity-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-shaders:
    runs-on: ubuntu-24.04
    env:
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            pkg-config
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp*.json' -print -quit)
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
      - name: CPU reference tests
        run: cargo +1.90.0 test -p ntsc-rs --no-default-features
      - name: Execute GPU shaders and compare to reference
        run: >-
          cargo +1.90.0 test -p ntsc-rs --features gpu-wgpu -- --include-ignored
          --skip pinned_upstream_default_fixed_seed_fingerprint
          --skip fixed_seed_stochastic_control_fingerprints
      - name: Smoke-test parity-gated benchmark
        run: cargo +1.90.0 bench -p ntsc-rs --features gpu-wgpu --bench backend_profile -- --test
      - name: Check shipped GUI and CLI WGPU path
        run: cargo +1.90.0 check -p ntsc-rs-gui --features gpu-wgpu
