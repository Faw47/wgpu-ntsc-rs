[package]
name = "ntsc-rs-openfx-plugin"
version = "0.1.7"
edition = "2021"
license = "MIT OR ISC OR Apache-2.0"
repository = "https://github.com/valadaptive/ntsc-rs/tree/main/crates/openfx-plugin"

[dependencies]
allocator-api2 = "0.2.16"
ntsc-rs = { path = "../ntscrs" }
rfd = "0.15.3"

[build-dependencies]
bindgen = "0.71"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = ["gpu-wgpu"]
gpu-wgpu = ["ntsc-rs/gpu-wgpu"]
