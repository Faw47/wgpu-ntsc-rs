[package]
name = "ntsc-rs"
version = "0.1.2"
edition = "2024"
license = "MIT OR ISC OR Apache-2.0"
repository = "https://github.com/valadaptive/ntsc-rs/tree/main/crates/ntscrs"

[dependencies]
fearless_simd = "0.7.0"
num_enum = { version = "0.7.5", default-features = false }
ntsc-rs-macros = { path = "../macros" }
hifijson = "0.5"
rayon-core = { version = "1.13.0", optional = true }
num_cpus = { version = "1.16.0", optional = true }
sval = { version = "2.14.1", features = ["std"] }
sval_json = { version = "2.14.1", features = ["std"] }
wgpu = { version = "27.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
thiserror = { version = "2.0.11", optional = true }
naga = { version = "27.0.3", features = ["wgsl-in"], optional = true }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
image = { version = "0.25.1", default-features = false, features = ["png"] }

[features]
default = ["rayon"]
rayon = ["dep:rayon-core", "dep:num_cpus"]
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:thiserror", "dep:naga"]
gpu-cuda = []

[[bench]]
name = "filter_profile"
harness = false

[lints]
workspace = true

[[bench]]
name = "backend_profile"
harness = false

[[bench]]
name = "snow_profile"
harness = false
